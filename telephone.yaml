esphome:
  name: telephone
  friendly_name: telephone
      
esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: "JIfaMgf9LImo+uUI6efK/+1c1v9nYnYNiNFQK56xzYk="

ota:
  - platform: esphome
    password: "28cae50d7289dd27f986761948b7d2dc"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Telephone Fallback Hotspot"
    password: "Ws2cDekp9TIE"

captive_portal:


# -------------------------
# Inputs
# -------------------------

# Analog input for speaker detection
sensor:
  - platform: adc
    pin: GPIO34
    name: "Speaker Voltage"
    id: speaker_voltage
    sampling_mode: max
    update_interval: 50ms
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

binary_sensor:
  # Hook switch input
  - platform: gpio
    pin:
      number: GPIO15
      mode: INPUT_PULLUP
    name: "Hook"
    id: hook
    on_press:
      then:
        - script.execute: hook_down
    on_release:
      then:
        - script.execute: hook_up

  # Dial pulse input
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
    name: "Dial"
    id: dial
    on_press:
      then:
        - script.execute: dial_pulse

# -------------------------
# I2C Bus for Keypad (ADG2188)
# -------------------------
i2c:
  sda: 21
  scl: 3
  scan: true
  frequency: 50kHz

i2c_device:
  id: adg2188
  address: 0x70

# -------------------------
# Outputs (Bell)
# -------------------------
output:
  - platform: gpio
    pin: 25
    id: bell_1

  - platform: gpio
    pin: 26
    id: bell_2

# -------------------------
# Constants
# -------------------------
globals:
  - id: ring_min_voltage
    type: float
    initial_value: "0.1"

  - id: pulse_count # counts pulses from dial
    type: int
    initial_value: "0"

  - id: pulse_timer_running # true when pulse counting timer is running
    type: bool
    initial_value: "false"

  - id: ringing # true when the DECT phone is ringing
    type: bool
    initial_value: "false"

  - id: bell_required # true when the bell simulation is running
    type: bool
    initial_value: "false"

  - id: bell_active # true when the bell is actually making a sound as part of the UK cadence simulation
    type: bool
    initial_value: "false"

  - id: bell_direction # can be either 1 or 2 depending on which direction the bell dinger is pointing
    type: int
    initial_value: "1"

  - id: control_byte # for ADG2188 control
    type: uint8_t
    initial_value: "0"

